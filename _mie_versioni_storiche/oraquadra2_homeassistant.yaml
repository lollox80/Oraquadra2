          id(blink_seconds) = false;

# Number per il web server
number:
  - platform: template
    name: "${friendly_name} Brightness"
    id: brightness_number
    optimistic: true
    min_value: 0
    max_value: 255
    step: 1
    on_value:
      then:
        - lambda: |-
            id(led_matrix).turn_on().set_brightness(x);

# Select per il web server
