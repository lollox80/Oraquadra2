# Variabili globali - basate sul codice Arduino
globals:
  - id: preset_var
    type: int
    restore_value: true
    initial_value: "0"
  - id: blink_seconds
    type: bool
    restore_value: true
    initial_value: "true"
  - id: alexa_off
    type: bool
    restore_value: false
    initial_value: "false"
  - id: current_mode
    type: int
    restore_value: true
    initial_value: "0"

# Configurazione pulsanti - stessi pin del codice Arduino
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO7  # BUTTON_MODE dal codice Arduino
      mode: INPUT_PULLUP
      inverted: true
    name: "${friendly_name} Mode Button"
    id: pulsante_mode
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      then:
        - lambda: |-
            id(preset_var) = (id(preset_var) + 1) % 11;
            // Applica preset come nel codice Arduino
            switch(id(preset_var)) {
              case 0: id(led_matrix).turn_on().set_effect("Orologio a Parole"); break;
              case 1: id(led_matrix).turn_on().set_effect("Rainbow"); break;
              case 2: id(led_matrix).turn_on().set_effect("Matrix"); break;
              case 3: id(led_matrix).turn_on().set_effect("Matrix2"); break;
              case 4: id(led_matrix).turn_on().set_effect("Color Wipe"); break;
              case 5: id(led_matrix).turn_on().set_effect("Bianco"); break;
              case 6: id(led_matrix).turn_on().set_effect("Blu"); break;
              case 7: id(led_matrix).turn_on().set_effect("Rosso"); break;
              case 8: id(led_matrix).turn_on().set_effect("Verde"); break;
              case 9: id(led_matrix).turn_on().set_effect("Viola"); break;
              case 10: id(led_matrix).turn_on().set_effect("Random"); break;
            }
            
  - platform: gpio
    pin:
      number: GPIO6  # BUTTON_SEC dal codice Arduino
      mode: INPUT_PULLUP
      inverted: true
    name: "${friendly_name} Seconds Button"
    id: pulsante_secondi
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      then:
        - lambda: |-
            id(blink_seconds) = !id(blink_seconds);

