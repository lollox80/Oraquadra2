            id(led_matrix).turn_on().set_effect(x);

# Gestione luminosità automatica giorno/notte
interval:
  - interval: 1min
    then:
      - lambda: |-
          int hour = id(esptime).now().hour;
          int brightness = (hour < 7 || hour >= 19) ? 32 : 64;  // Come nel codice Arduino
          id(led_matrix).turn_on().set_brightness(brightness);
          id(brightness_number).publish_state(float(brightness));

# Sensori di sistema
sensor:
  - platform: internal_temperature
    name: "${friendly_name} Temperature"
    id: temp_sensor
    update_interval: 60s
    filters:
      - lambda: |-
          return x * (9.0/5.0) + 32.0;
    on_value:
      then:
        - lambda: |-
            if (x > 85.0) {
              ESP_LOGE("main", "Temperatura troppo alta: %.1f°F", x);
              id(led_matrix).turn_on().set_brightness(32);
            }

  - platform: uptime
    name: "${friendly_name} Uptime"
    id: uptime_sensor
    update_interval: 60s

  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
    id: wifi_strength